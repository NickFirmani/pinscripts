id: jaws-2024
name: Jaws
manufacturer: Stern
year: 2024
metadata:
designer: Keith Elwin
artist: Michael Barnard
production: Pro, Premium, and Limited Edition; Limited Edition capped at 1,000 units worldwide.
era: Modern Stern SPIKE 2
multiball: Jaws Multiballs, Bounty Hunt and Celebration Multiballs, plus Fish Finder and wizard multiballs.
hook: Build Jaws Multiball by chumming the water, completing the moving red-arrow chum line, attaching barrels at the fin, then cash in. In parallel, Shark Encounters and bounty hunts build persistent advantages, especially the Machete shot multiplier.
rules:
primary: "The tournament core is two parallel tracks: build Jaws Multiball through the chum bucket, red arrows, barrels and fin; and build value through Shark Encounters, bounty hunts, beach rescues and Machete. Completed Shark Encounters permanently raise the base Machete multiplier, while bounty progress is untimed and carries between balls."
bullets:
  - "Jaws Multiball: hit the chum bucket, complete the moving red-arrow chum line, raise the fin, attach the required barrel or barrels, then make a return-feed shot to start multiball."
  - Shark Encounters are the five main timed modes. Complete one and collect its fin jackpot to add a permanent +1x to base Machete for the rest of the game.
  - Machete starts at 2x. Light it at the left target bank, then a lit return lane activates the multiplier on the next qualifying shot; a lit Machete can be brought into multiball.
  - Bounty hunts run untimed in the background and their objective progress carries from ball to ball. Finish the tasks, shoot the reel, then capture the shark in its multiball for a bounty and perk.
  - Rescuing three beachgoers at one beach starts a Beach Closed hurry-up. The fifth hurry-up includes the base values of the prior four and then leads to a choice of Search or Rescue Multiball.
watch:
  * title: Machete ready?
      text: Look for the lit Machete return lane and its current multiplier. A player may deliberately delay a valuable shot until Machete is active; completed encounters permanently increase the base multiplier.
  * title: What persists after a drain
      text: Bounty-hunt objective progress and permanent Machete increases belong to that player and carry between balls. A drain may end a timed mode without erasing the player's larger game plan.
  * title: Life Ring
      text: If the Life Ring is qualified, the action button can briefly arm a left-outlane ball save. Watch the player reach for the button as a ball approaches the left outlane.
  * title: Fin equals conversion
      text: "The moving fin is frequently the conversion shot: it attaches barrels for Jaws Multiball and collects Shark Encounter jackpots. A missed fin can turn completed setup into a dangerous rebound."
      shots:
  * name: Left target bank
      value: Lights and advances Machete, Fish Finder and Pipit-related value. This bank is a major setup area for multipliers and utility, not merely target points.
      risk: High
      diagram: 1
  * name: Wave ramp / left-side major shot
      value: Starts one Shark Encounter, advances ORCA toward Quint's Shack, and participates in chum-line and combo progress.
      risk: Medium
      diagram: 2
  * name: Center ramp
      value: Starts a Shark Encounter, advances chum-line work, and is a common progression or wizard-start shot. It is also central to several valuable combos.
      risk: Medium
      diagram: 3
  * name: Chum bucket / boat-shark captive area
      value: Starts and advances the chum line for Jaws Multiball, lights Shark Encounters after required hits, and is the shark-damage or super-jackpot area in several features.
      risk: High
      diagram: 4
  * name: Fishing reel / harpoon lane / fin
      value: The reel qualifies and starts bounty multiballs; the harpoon lane feeds Quickshots and barrel setup; the fin collects barrels, encounter jackpots and other major cash-outs.
      risk: Medium-High
      diagram: 5
  * name: Right ramp / Quint's Shack
      value: Starts a Shark Encounter, collects lit Gear, can start a lit bounty hunt, and awards Quint's Shack utility after ORCA is advanced.
      risk: Medium
      diagram: 6
      strategy:
      ahead: Favor controlled progress toward the first Jaws Multiball and take reliable encounter or bounty value without overworking the dangerous target and captive-ball areas. Use Machete on a shot you already intend to make rather than manufacturing extra risk just to raise it.
      behind: "Raise variance: build Machete, finish a Shark Encounter for another permanent multiplier step, pursue a bounty capture, or set up a large Beach Closed hurry-up or multiball cash-out. Quickshots can also snowball because their multiplier builds with consecutive successes."
      key_decision: "The recurring decision is setup versus cash-out: spend more dangerous shots building Machete, chum-line value, encounter boosts or bounty value, or take the currently available multiball, hurry-up or jackpot before the ball gets away."
      danger:
  * The center captive-ball and shark area can reject the ball toward the middle; repeated setup hits are valuable but expose the player to sudden drains.
  * The left target bank is strategically powerful but can produce ugly rebounds. Players often accept that risk specifically to light or raise Machete and Fish Finder.
  * The moving fin is a high-leverage target with variable rebounds. Missing a barrel or encounter-jackpot collect can immediately turn offense into defense.
  * The mini-flipper and nearby lanes create unusual feeds. Watch whether the player has control before committing to a timed Quickshot or Machete cash-out.
  * A qualified Life Ring only helps the left outlane when activated at the right moment; if it is unlit or mistimed, the drain is real.
commentary:
  * He's chumming the water now; those red arrows are building both the path to Jaws Multiball and the value he can take into it.
  * That encounter completion matters beyond this mode because it permanently raises his base Machete multiplier.
  * The bounty hunt is still alive even if this ball ends. It is untimed background progress, so every qualifying shot is banking work for later.
  * "Watch the return lanes: if Machete is lit, the next valuable shot can suddenly be worth a multiple of its normal value."
  * The fin is the cash-out shot here. He has done the setup; now he still has to hit a moving target and survive the rebound.
  * Keep an eye on the Life Ring light and his action-button hand if the ball heads toward the left outlane.
trivia:
  * "Lead designer Keith Elwin also designed modern Stern titles including Iron Maiden, Jurassic Park, Avengers: Infinity Quest and Godzilla."
  * Michael Barnard created the cabinet and playfield artwork.
  * The game uses material from all four Jaws films and includes custom speech performed by Richard Dreyfuss.
  * Stern launched Jaws in January 2024 in Pro, Premium and Limited Edition versions; the Limited Edition run was capped at 1,000 games worldwide.
  * The Limited Edition backglass uses the iconic Jaws poster artwork by Roger Kastel, while the game features John Williams's famous film theme.
summary: Chum water → complete red arrows → attach barrels at the fin → start Jaws Multiball → build Machete through encounters → multiply a major cash-out
venue_notes:
  * Rules summarized against 1.01-era software. Confirm the installed revision and model before air because Pro and Premium/LE have meaningful playfield and rules differences.
  * On a Competition install, extra balls are disabled. A disabled extra-ball award scores 15M, and that award can be multiplied by Machete.
  * Tournament operators can alter individual adjustments beyond the Competition install, so verify local ball-save, tilt and other settings.
