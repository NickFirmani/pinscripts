id: attack-from-mars
name: "Attack from Mars"
manufacturer: "Bally"
year: 1995
metadata:
designer: "Brian Eddy"
artist: "Doug Watson"
production: "3,450 units"
era: "Williams/Bally WPC-95"
multiball: "Regular 3-ball; Total Annihilation 4-ball; Martian 2-ball; Strobe 3-ball; Rule the Universe 4-ball"
hook: "A brutally readable fan-layout game: bash the center to destroy five invading saucers, then Conquer Mars, while building multiballs on the surrounding ramps and loops. Center progress becomes enormous late, but repeated forcefield and saucer shots are also the game's defining danger."
rules:
primary: "Tournament play usually revolves around three intersecting plans: advance the center Attack Waves toward Conquer Mars; build regular multiball and complete all five unique jackpots for a roaming Super Jackpot; and make each outer ramp/orbit three times to start Total Annihilation. Starting an Attack Wave before multiball is valuable because saucer damage continues during most multiballs, but a new Attack Wave normally cannot be started during one."
bullets:
  - "Lower the three-target forcefield, damage the exposed saucer, then shoot the center hole to destroy it. Five countries lead to Conquer Mars: ten center-hole shots, with the last worth 2.5B."
  - "Regular multiball: lock three balls. Five distinct jackpot shots light a roaming Super Jackpot; the first Super is 250M and later Supers increase, making clean shot completion materially important."
  - "Total Annihilation (TA): complete each of the two ramps and two orbits three times. Their third completions start center hurry-ups; finishing all four starts a 4-ball jackpot multiball."
  - "Complete M-A-R-T-I-A-N to light Martian Attack at Stroke of Luck. Kill the four jumping Martians within the timer to start 2-ball Martian Multiball. Saved Martian Bombs carry across Martian Attacks."
  - "Rule the Universe requires six feats: a Super Jackpot, TA, Martian Multiball, Conquer Mars, Super Jets, and a 5-Way Combo. Reaching 5B during the mode awards another 5B."
watch:
  * title: "Which saucer is this?"
      text: "Attack Waves get progressively harder and more valuable. Once the first five countries are saved, Conquer Mars changes the center into ten hole shots and a 2.5B finishing award."
  * title: "Is a Super Jackpot lit?"
      text: "After all five regular-multiball jackpots, the Super Jackpot roams among the five major shots. If multiball ends while it is lit, a short Last Chance continues after the drain to one ball."
  * title: "How close is Total Annihilation?"
      text: "Each outer ramp and orbit has three TA inserts. A player one or two shots from completing the set may abandon the center to start the 4-ball multiball; overlapping hurry-ups can also be very valuable."
  * title: "What survives the drain?"
      text: "Major objective progress is player-specific and much of it carries between balls, including saved countries, TA progress, locks, Rule the Universe qualifications, and unused Martian Bombs. Bonus multiplier normally resets unless held."
      shots:
  * name: "Forcefield / Saucer / Center Hole"
      value: "Core progression. Lower the forcefield, damage and destroy five saucers, then make ten center-hole shots to Conquer Mars; the final Mars shot is 2.5B."
      risk: "High"
      diagram: 1
  * name: "Lock Ramp / Lock Hole"
      value: "Builds three virtual locks for regular multiball. During Total Annihilation, the lock ramp is the Annihilation Jackpot shot."
      risk: "Medium"
      diagram: 2
  * name: "Left Orbit - Capture"
      value: "One of four TA lanes; three completions finish Capture. Also participates in regular-multiball jackpots and combos."
      risk: "Medium"
      diagram: 3
  * name: "Left Ramp - Big-O-Beam"
      value: "One of four TA lanes; three completions finish Big-O-Beam. A major jackpot and combo shot."
      risk: "Low"
      diagram: 4
  * name: "Right Ramp - Tractor Beam"
      value: "One of four TA lanes; three completions finish Tractor Beam. A major jackpot and combo shot."
      risk: "Low"
      diagram: 5
  * name: "Right Orbit - Atomic Blaster"
      value: "One of four TA lanes; three completions finish Atomic Blaster. Also a regular-multiball jackpot and combo shot."
      risk: "Medium"
      diagram: 6
      strategy:
      ahead: "Prefer controlled ramp/orbit progress and multiball over repeated naked center bashes. Cash lit hurry-ups and jackpots when convenient, and protect a large lead rather than forcing late saucer hits."
      behind: "Lean into the swingy objectives: complete Total Annihilation, chase regular-multiball Super Jackpots, or push late Attack Waves and Conquer Mars. A 2.5B Mars finish or a strong multiball can erase a large deficit quickly."
      key_decision: "Before starting multiball, ask whether an Attack Wave is already running. Starting the wave first lets multiball balls help chew through the dangerous center; starting multiball first can lock the player out of beginning the next wave until multiball ends."
      danger:
  * "The center forcefield and saucer targets are lucrative but can reject the ball quickly toward the middle or outlanes; late-wave center bashing is the classic risk/reward decision."
  * "Martian standups are another rebound-heavy target set. A player may use Martian Bombs instead of exposing the ball to one more dangerous target hit."
  * "Orbit shots feed the pop-bumper area under many conditions, reducing immediate control compared with clean ramp returns."
  * "During multiball, watch for the player to trap balls and pick off required unique jackpots rather than spray shots; one missing jackpot blocks the Super."
commentary:
  * "That center shot is not just points; they're working through the next saucer, and each wave gets more valuable."
  * "They started the Attack Wave before multiball, so every loose ball can now help damage the saucer."
  * "They need five different jackpots before the Super Jackpot lights; repeating the same safe shot will not finish the set."
  * "Total Annihilation is close: those three-light inserts on the two ramps and two orbits show exactly what remains."
  * "The Super is roaming now. If they drain down to one ball while it is lit, there is still a brief Last Chance."
  * "That flashing launch button can be a Martian Bomb. It can finish a remaining Martian during Martian Attack, even after the ball has entered an outlane if used before the trough."
trivia:
  * "Attack from Mars was designed by Brian Eddy, with software by Lyman Sheats and artwork by Doug Watson."
  * "About 3,450 original machines were produced, using the Williams WPC-95 platform under the Bally label."
  * "The theme deliberately plays like a campy 1950s alien-invasion movie; the game's concept predates the similarly named 1996 film Mars Attacks!"
  * "Doug Watson not only created the artwork but also voiced the Martians; Tim Kitzrow supplied additional callouts."
summary: "Start Attack Wave → stack multiball → destroy saucers → finish TA or Super Jackpots → Conquer Mars for 2.5B → six feats light Rule the Universe"
venue_notes:
  * "Confirm ROM/software revision: some Super Jackpot progression and a few edge-case behaviors differ between revisions."
  * "Confirm whether tournament mode is enabled. On original software, tournament mode de-randomizes Stroke of Luck to a fixed 50M award instead of its normal random feature awards."
  * "Confirm extra-ball policy. Events commonly disable extra balls or convert them to points; do not assume a lit Extra Ball grants another ball."
  * "Confirm ball count and lock difficulty. Default lock-lighting behavior differs between common 3-ball and 5-ball settings."
  * "Verify center forcefield/drop-target behavior and any broken-switch compensation; these materially affect how safe and fast saucer progress is."
