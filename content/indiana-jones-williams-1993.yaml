id: indiana-jones-williams-1993
name: 'Indiana Jones: The Pinball Adventure'
metadata:
  manufacturer: Williams Electronics
  year: 1993
  designer: Mark Ritchie and Doug Watson
  artist: Doug Watson
  production: 12,716
  era: WPC-DCS SuperPin widebody
  multiball: Idol Multiball, Lost Treasure, Well of Souls, Eternal Life
hook: Build Idol Multiball through E-N-T locks, then use the left ramp to light Jackpots
  and the right ramp to collect them. Parking balls in the Idol can turn a Jackpot
  into a 2× or 3× score.
rules:
  primary: 'The direct tournament route is Idol Multiball: complete E-N-T, lock three
    balls in the center Idol, then shoot left ramp to light and right ramp to collect
    Jackpots. The central decision is whether to cash now or park another ball in
    the Idol for a multiplier.'
  bullets:
  - The first three base Jackpots are 20M, 30M, and 40M; one held Idol ball makes
    the current Jackpot 2× and two make it 3×.
  - After three regular Jackpots, shoot the left ramp to light Super Jackpot and hit
    the captive ball for 80M, 90M, then 100M.
  - Complete I-N-D-Y to advance Bonus X, light Friends, and eventually light Extra
    Ball.
  - Light all five Friends, build lit loops, then collect the Friends Jackpot at the
    right ramp; it caps at 200M.
  - Complete ADVENTURE to enter the Path of Adventure from the right ramp; all 12
    modes lead to Eternal Life.
watch:
- title: Balls in the Idol
  text: In single-ball play they are locks. During Jackpot scoring, one or two held
    balls mean a 2× or 3× current Jackpot.
- title: Jackpot lamps
  text: Left-ramp Lite Jackpot followed by right-ramp Jackpot shows the core multiball
    cash-out sequence.
- title: Path of Adventure
  text: A flashing right ramp means ADVENTURE is complete and the player can enter
    the tilting upper playfield.
- title: Mode inserts
  text: Twelve completed adventures mean the next mode start begins Eternal Life,
    a six-ball wizard mode with a possible 1B Mega Jackpot.
skill_shots: []
features:
- type: ball-save
  name: Eternal Life ball save
  text: Available in single-ball play, Idol Multiball, and Lost Treasure; its duration
    is operator-adjustable.
- type: mystery-award
  name: Hand of Fate
  text: An inlane lights the mode saucer for a random award, which can include points,
    multiball, an Idol lock, Path of Adventure, or other advances.
- type: video-mode
  name: Video modes
  text: Raven Bar, Escape in the Mine Cart, and Choose Wisely use the flipper buttons
    and count toward the 12-mode progression.
- type: extra-ball
  name: Extra Balls
  text: Extra Balls can be lit through I-N-D-Y, Path of Adventure, certain modes,
    and Hand of Fate.
- type: player-control
  name: Flipper-button control
  text: The flipper buttons steer both the Path of Adventure mini-playfield and video
    modes.
shots:
- name: Mode saucer
  value: Starts modes and Hand of Fate; important for a mode-based route toward Eternal
    Life.
  risk: Medium
  diagram: 1
- name: Left ramp
  value: Lights Jackpot in multiball, advances modes, and is the first half of the
    main cash-out sequence.
  risk: Medium-High
  diagram: 2
- name: E-N-T drops and center hole
  value: Builds Idol locks and parks balls for 2× or 3× Jackpot multipliers.
  risk: High
  diagram: 3
- name: Captive ball
  value: Advances Lost Treasure and collects the 80M–100M Super Jackpot.
  risk: High
  diagram: 4
- name: Right ramp
  value: Collects Jackpot, enters Path of Adventure, and collects the Friends Jackpot.
  risk: High
  diagram: 5
strategy:
  ahead: Take straightforward Idol Multiball and clean Jackpots. Avoid forcing a second
    Idol hold when it leaves too few controlled balls; a ready mode or safe Path can
    be better.
  behind: Chase 3× Idol Jackpots and Super Jackpots. A prepared Friends Jackpot or
    high-value Path/Pit can swing the game; Eternal Life is a deep, survival-dependent
    route.
  key_decision: Cash the Jackpot now, or park another ball in the Idol for 2× or 3×?
    The multiplier is valuable, but it reduces the number of balls under control.
danger:
- Center E-N-T shots can create violent rebounds before the lock hole is exposed.
- Both ramps are steep; this copy is notably dangerous on right-ramp rejects.
- The right outlane can be wide, and the optional outlane save is disabled on this
  copy.
- Hard captive-ball hits can rebound unpredictably.
- Path of Adventure during multiball divides attention between the tilting upper field
  and live balls below.
commentary:
- Third lock—that starts Idol Multiball. Left ramp lights it; right ramp cashes it.
- They've parked one ball in the Idol, so this Jackpot is now double.
- Another Idol ball before the timer expires would make it a triple Jackpot.
- Three regular Jackpots are done; now the captive ball is the Super Jackpot shot.
- ADVENTURE is complete—the right ramp now accesses the Path of Adventure.
- All twelve adventures are finished; the next mode start is Eternal Life, with a
  billion-point Mega Jackpot available.
trivia:
- Indiana Jones was the first Williams pinball machine to use the DCS digital sound
  system.
- 'It was a Williams SuperPin widebody, alongside The Twilight Zone and Star Trek:
  The Next Generation.'
- John Rhys-Davies reprised Sallah and recorded new dialogue for the machine.
- The rotating Golden Idol physically stores and releases the three balls used for
  the main multiball.
- The Path of Adventure is a flipper-button-controlled tilting mini-playfield.
summary: E-N-T locks → Idol Multiball → left ramp lights → right ramp collects → Idol
  multiplier → Super Jackpot
venue_notes:
- Tournament Play is enabled, equalizing multiplayer multiball and Jackpot state.
- Extra Balls are disabled.
- Eternal Life ball save is set to factory/normal.
- The optional outlane save is disabled.
- Idol Jackpot multiplier duration is operator-adjustable; factory-medium documentation shows
  15 seconds.
- Right-ramp rejects are notably dangerous on this copy.
